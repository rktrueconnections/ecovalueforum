<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | EcoValue Forum</title>

  <!-- Prevent search engines from indexing the thank you page -->
  <meta name="robots" content="noindex">

  <style>
    :root {
      --ink: #18352d;
      --muted: #61736b;
      --soft: #eef2ed;
      --cream: #f7f8f4;
      --white: #ffffff;
      --line: #dfe6e0;
      --accent: #557d6d;
      --accent-dark: #3e6254;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: var(--ink);
      background: var(--cream);
      line-height: 1.65;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    /* NAVIGATION */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      max-width: 1180px;
      margin: auto;
      padding: 20px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 750;
      letter-spacing: -0.03em;
    }

    .brand span {
      font-weight: 400;
      color: var(--muted);
    }

    /* GENERAL */
    .container {
      max-width: 1180px;
      margin: auto;
      padding-left: 6%;
      padding-right: 6%;
    }

    main {
      flex: 1; /* Pushes footer to the bottom */
      display: flex;
      align-items: center;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.72rem;
      font-weight: 750;
      color: var(--accent);
      margin-bottom: 18px;
    }

    h1 {
      letter-spacing: -0.04em;
      line-height: 1.08;
      font-size: clamp(3.2rem, 7vw, 6.8rem);
      max-width: 950px;
      margin: 0 0 30px;
    }

    .lead {
      font-size: 1.28rem;
      color: var(--muted);
      max-width: 760px;
    }

    /* MESSAGE SECTION */
    .message-section {
      width: 100%;
      padding-top: 50px;
      padding-bottom: 100px;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      padding: 13px 23px;
      border-radius: 5px;
      font-weight: 650;
      font-size: 0.95rem;
      margin-top: 38px;
    }

    .button-primary {
      background: var(--ink);
      color: white;
    }

    .button-primary:hover {
      opacity: 0.86;
    }

    /* FOOTER */
    footer {
      background: #102820;
      color: #aebeb7;
      padding: 35px 0;
      font-size: 0.85rem;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 30px;
    }

    /* MOBILE */
    @media (max-width: 800px) {
      .footer-inner {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<!-- NAVIGATION -->
<header>
  <div class="nav">
    <!-- Links back to the homepage -->
    <a class="brand" href="/">
      EcoValue <span>Forum</span>
    </a>
  </div>
</header>

<main>
  <section class="message-section">
    <div class="container">

      <div class="eyebrow">Submission Received</div>

      <h1>Thank You.</h1>

      <p class="lead">
        Your information has been successfully submitted. We will be in touch soon with updates and opportunities across the EcoValue Forum community.
      </p>

      <a class="button button-primary" href="/">
        ← Return to Homepage
      </a>

    </div>
  </section>
</main>

<!-- FOOTER -->
<footer>
  <div class="container footer-inner">
    <div>
      © 2026 EcoValue Forum · Israel
    </div>
    <div>
      Environmental value through economic value.
    </div>
  </div>
</footer>

</body>
</html>
